name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

      - name: Verify axioms
        run: |
          lake env lean SleepLoop/Verification.lean 2>&1 | tee /tmp/axioms.txt
          grep -q "propext, Classical.choice, Quot.sound" /tmp/axioms.txt
          ! grep -q "sorryAx" /tmp/axioms.txt

      - name: Check for sorry and custom axioms
        run: |
          ! grep -rn --include="*.lean" "^ *sorry" SleepLoop/ | grep -v ".lake" | grep -v "ComparatorChallenge" | grep -q .
          ! grep -rn --include="*.lean" "^axiom " SleepLoop/ | grep -v ".lake" | grep -q .

      - name: Verify MainTheorem isolation
        run: |
          ! grep -q "^import SleepLoop\." SleepLoop/MainTheorem.lean

      - name: Install lean4checker
        run: |
          git clone --depth 1 --branch v4.28.0 https://github.com/leanprover/lean4checker
          cd lean4checker && lake build

      - name: Run lean4checker
        run: lake env lean4checker/.lake/build/bin/lean4checker

      - name: Install comparator tools
        run: |
          git clone --depth 1 --branch v4.28.0 https://github.com/leanprover/lean4export
          cd lean4export && lake build
          git clone --depth 1 --branch v0.1.15 https://github.com/Zouuup/landrun
          cd landrun && go build -o landrun ./cmd/landrun && sudo cp landrun /usr/local/bin/
          git clone --depth 1 https://github.com/leanprover/comparator
          cd comparator && lake build

      # comparator verifies ProofOfMainTheorem proves exactly the statement in
      # ComparatorChallenge (which imports MainTheorem's Mathlib-only types).
      # ComparatorChallenge.lean contains an intentional sorry as the challenge
      # target — it is never imported by any proof file.
      - name: Run comparator
        run: lake env comparator/.lake/build/bin/comparator comparator.json

      # docgen removed — GitHub Pages used by blueprint workflow instead
